# Tema de marca "reservaya" para el login de Keycloak.
# Construido sobre Bootstrap 5 (css/bootstrap.min.css) + SweetAlert2.
# Hereda las plantillas/formularios del base clasico "keycloak", cuyo markup
# si respeta el mapeo kc*Class (keycloak.v2 usa PatternFly y los ignora).
parent=keycloak

# URL del sitio (enlace "volver al sitio" y logo).
portalUrl=https://d1ydnh3hbo1zxr.cloudfront.net

# Idiomas soportados (el realm usa es por defecto).
locales=en,es

# Recursos propios (Bootstrap primero, luego la marca). Los JS van explícitos
# en template.ftl (sweetalert2.min.js y theme.js).
styles=css/bootstrap.min.css,css/reservaya.css

# --- Mapeo de clases de los formularios base a Bootstrap + marca "reservaya" ----
kcHtmlClass=ry-html
kcBodyClass=ry-body
kcLoginClass=ry-shell

# Campos de formulario (clases Bootstrap: form-control/form-label/input-group)
kcFormClass=ry-form
kcFormGroupClass=mb-3 ry-field
kcLabelClass=form-label ry-label
kcInputClass=form-control ry-input
kcInputGroup=input-group ry-input-group
kcInputWrapperClass=ry-input-wrapper
kcInputErrorMessageClass=ry-error
kcFormSettingClass=ry-field--row
kcFormOptionsClass=ry-options
kcFormOptionsWrapperClass=ry-options__link
kcLabelWrapperClass=d-flex justify-content-between align-items-baseline ry-label-row
kcContentWrapperClass=ry-content
kcFormPasswordVisibilityButtonClass=btn btn-outline-secondary ry-input-toggle
kcFormPasswordVisibilityIconShow=ry-icon-show
kcFormPasswordVisibilityIconHide=ry-icon-hide
kcResetFlowIcon=ry-reset-icon

# Botones (Bootstrap btn/btn-primary + utilidades de bloque)
kcButtonClass=btn
kcButtonPrimaryClass=btn-primary
kcButtonSecondaryClass=btn-outline-secondary
kcButtonDefaultClass=btn-outline-secondary
kcButtonBlockClass=w-100
kcButtonLargeClass=btn-lg fw-semibold
kcFormButtonsClass=d-grid gap-2 mt-2
kcFormButtonsWrapperClass=ry-actions__row

# Proveedores de identidad / login social
kcFormSocialAccountSectionClass=ry-social
kcFormSocialAccountListClass=ry-social__list
kcFormSocialAccountListGridClass=ry-social__list--grid
kcFormSocialAccountListItemClass=ry-social__item
kcFormSocialAccountListButtonClass=ry-social__btn
kcFormSocialAccountListButtonDisabledClass=ry-social__btn--disabled
kcFormSocialAccountGridItem=ry-social__btn
kcCommonLogoIdP=ry-social__icon
kcFormSocialAccountNameClass=ry-social__name

# OTP
kcLoginOTPListClass=ry-otp
kcLoginOTPListInputClass=ry-otp__radio
kcLoginOTPListItemHeaderClass=ry-otp__header
kcLoginOTPListItemIconBodyClass=ry-otp__icon
kcLoginOTPListItemIconClass=ry-otp__glyph
kcLoginOTPListItemTitleClass=ry-otp__title
kcLoginOTPListSelectedClass=ry-otp--selected

# Alertas (el shell usa SweetAlert2; esto queda como respaldo sin JS)
kcAlertClass=ry-alert
kcAlertTitleClass=ry-alert__text
kcFeedbackSuccessIcon=ry-alert__badge--success
kcFeedbackWarningIcon=ry-alert__badge--warning
kcFeedbackErrorIcon=ry-alert__badge--error
kcFeedbackInfoIcon=ry-alert__badge--info